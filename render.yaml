services:
  - type: web
    name: tribunal-virtual-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tribunal-virtual-db
          property: connectionString
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: tribunal-virtual-db
    plan: free
